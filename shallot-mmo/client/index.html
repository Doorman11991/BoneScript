<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShallotMMO</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0a0a0f; color: #e0e0e0; font-family: monospace; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }

      #ui {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
      }

      /* HUD */
      #hud {
        position: absolute; bottom: 24px; left: 24px;
        display: flex; flex-direction: column; gap: 6px;
        pointer-events: none;
      }
      .bar-label { font-size: 11px; color: #888; margin-bottom: 2px; }
      .bar { width: 180px; height: 10px; background: #1a1a2e; border-radius: 3px; overflow: hidden; }
      .bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
      #hp-fill  { background: #e05555; }
      #mp-fill  { background: #5588e0; }
      #xp-fill  { background: #55c080; }
      #player-info { font-size: 13px; color: #ccc; margin-bottom: 8px; }

      /* Chat */
      #chat {
        position: absolute; bottom: 24px; right: 24px;
        width: 320px; pointer-events: all;
      }
      #chat-messages {
        height: 160px; overflow-y: auto; background: rgba(0,0,0,0.55);
        border: 1px solid #222; border-radius: 4px; padding: 8px;
        font-size: 12px; display: flex; flex-direction: column; gap: 3px;
        margin-bottom: 6px;
      }
      .chat-msg { color: #ccc; }
      .chat-msg .sender { color: #7ec8e3; font-weight: bold; }
      .chat-msg.system { color: #888; font-style: italic; }
      #chat-input-row { display: flex; gap: 6px; }
      #chat-input {
        flex: 1; background: rgba(0,0,0,0.6); border: 1px solid #333;
        color: #eee; padding: 6px 8px; border-radius: 4px; font-size: 12px;
        font-family: monospace;
      }
      #chat-send {
        background: #2a4a7f; border: none; color: #eee; padding: 6px 12px;
        border-radius: 4px; cursor: pointer; font-size: 12px;
      }
      #chat-send:hover { background: #3a5a9f; }

      /* Minimap */
      #minimap {
        position: absolute; top: 24px; right: 24px;
        width: 140px; height: 140px;
        background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 4px;
        overflow: hidden;
      }
      #minimap canvas { width: 100%; height: 100%; }

      /* Login overlay */
      #login-overlay {
        position: absolute; inset: 0;
        background: rgba(5,5,15,0.92);
        display: flex; align-items: center; justify-content: center;
        pointer-events: all;
      }
      #login-box {
        background: #0f0f1e; border: 1px solid #2a2a4a;
        border-radius: 8px; padding: 36px 40px; width: 340px;
        display: flex; flex-direction: column; gap: 14px;
      }
      #login-box h1 { font-size: 22px; color: #7ec8e3; text-align: center; letter-spacing: 2px; }
      #login-box p  { font-size: 12px; color: #666; text-align: center; }
      .field { display: flex; flex-direction: column; gap: 4px; }
      .field label { font-size: 11px; color: #888; }
      .field input {
        background: #0a0a18; border: 1px solid #2a2a4a; color: #eee;
        padding: 8px 10px; border-radius: 4px; font-size: 13px; font-family: monospace;
      }
      .field input:focus { outline: none; border-color: #4a6aaf; }
      #login-btn, #register-btn {
        padding: 10px; border-radius: 4px; border: none;
        font-size: 13px; cursor: pointer; font-family: monospace;
      }
      #login-btn    { background: #2a4a7f; color: #eee; }
      #register-btn { background: #1a2a3f; color: #aaa; border: 1px solid #2a3a5f; }
      #login-btn:hover    { background: #3a5a9f; }
      #register-btn:hover { background: #2a3a5f; }
      #login-error { font-size: 12px; color: #e05555; text-align: center; min-height: 16px; }

      /* Zone label */
      #zone-label {
        position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
        font-size: 13px; color: #888; letter-spacing: 1px;
        background: rgba(0,0,0,0.4); padding: 4px 14px; border-radius: 12px;
      }

      /* Player list */
      #player-list {
        position: absolute; top: 24px; left: 24px;
        background: rgba(0,0,0,0.5); border: 1px solid #222;
        border-radius: 4px; padding: 10px 14px; min-width: 140px;
        font-size: 12px;
      }
      #player-list h3 { color: #7ec8e3; font-size: 11px; margin-bottom: 6px; letter-spacing: 1px; }
      .player-entry { color: #ccc; padding: 2px 0; }
      .player-entry.self { color: #7ec8e3; }
      .player-entry.in-combat { color: #e05555; }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <div id="ui">
      <!-- Login -->
      <div id="login-overlay">
        <div id="login-box">
          <h1>SHALLOT MMO</h1>
          <p>WebGPU · Free to Play</p>
          <div class="field">
            <label>USERNAME</label>
            <input id="username" type="text" placeholder="adventurer" autocomplete="off" />
          </div>
          <div class="field">
            <label>PASSWORD</label>
            <input id="password" type="password" placeholder="••••••••" />
          </div>
          <div id="login-error"></div>
          <button id="login-btn">ENTER WORLD</button>
          <button id="register-btn">CREATE ACCOUNT</button>
        </div>
      </div>

      <!-- HUD (hidden until logged in) -->
      <div id="hud" style="display:none">
        <div id="player-info"></div>
        <div class="bar-label">HP</div>
        <div class="bar"><div class="bar-fill" id="hp-fill" style="width:100%"></div></div>
        <div class="bar-label">MP</div>
        <div class="bar"><div class="bar-fill" id="mp-fill" style="width:100%"></div></div>
        <div class="bar-label">XP</div>
        <div class="bar"><div class="bar-fill" id="xp-fill" style="width:0%"></div></div>
      </div>

      <!-- Zone label -->
      <div id="zone-label" style="display:none">Loading zone...</div>

      <!-- Nearby players -->
      <div id="player-list" style="display:none">
        <h3>NEARBY</h3>
        <div id="player-entries"></div>
      </div>

      <!-- Minimap -->
      <div id="minimap" style="display:none">
        <canvas id="minimap-canvas" width="140" height="140"></canvas>
      </div>

      <!-- Chat -->
      <div id="chat" style="display:none">
        <div id="chat-messages"></div>
        <div id="chat-input-row">
          <input id="chat-input" type="text" placeholder="Press Enter to chat..." maxlength="200" />
          <button id="chat-send">SEND</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
