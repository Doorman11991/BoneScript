# Generated by BoneScript compiler.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inventory_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_platform_test

      - name: Run tests
        run: npx ts-node src/tests.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_platform_test
          JWT_SECRET: test-secret
          TEST_BASE_URL: http://localhost:3000

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t inventory-platform:${{ github.sha }} .
      - name: Tag as latest
        run: docker tag inventory-platform:${{ github.sha }} inventory-platform:latest
